<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Larder{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body data-authed="{{ '1' if authed else '0' }}">
  <header class="bar">
    <a class="brand" href="/">Larder</a>
    {% if authed %}
    <nav>
      <a href="/">Home</a>
      <a href="/settings">Settings</a>
      <a href="/audit">Activity log</a>
    </nav>
    <form method="post" action="/lock"><button class="quiet" type="submit">Lock</button></form>
    {% endif %}
  </header>
  <main class="{% block main_class %}{% endblock %}">
    {% if message %}<p class="notice">{{ message }}</p>{% endif %}
    {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer>Larder {{ version }} &middot; everything stays on this device</footer>
</body>
</html>
