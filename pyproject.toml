[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "larder"
version = "0.0.1"
description = "Local-only practice management for a private nutritionist"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "platformdirs>=4",
    "sqlcipher3-binary>=0.5.4; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sqlcipher3-wheels>=0.5.4; sys_platform != 'linux' or platform_machine != 'x86_64'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2"]

[project.scripts]
larder = "larder.__main__:main"

[tool.setuptools.packages.find]
include = ["larder*"]

[tool.setuptools.package-data]
larder = ["migrations/*.sql", "templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
