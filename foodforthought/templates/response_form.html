{% extends "client_base.html" %}
{% from "_macros.html" import form_fields, date_input %}
{% block tab %}
<section class="card">
  <h2>{{ form_name }}</h2>
  <form method="post">
    {{ date_input("Date completed", "completed_on", completed_on, required=true) }}
    {{ form_fields(fields, answers) }}
    <div class="actions">
      <button type="submit">Save form</button>
      <a href="{{ '/clients/%d/forms/%d' % (client.id, existing.id) if existing else '/clients/%d/forms' % client.id }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
