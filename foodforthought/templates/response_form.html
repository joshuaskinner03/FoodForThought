{% extends "client_base.html" %}
{% from "_macros.html" import form_fields %}
{% block tab %}
<section class="card">
  <h2>{{ form_name }}</h2>
  <form method="post">
    <div class="field"><label for="completed_on">Date completed</label><input id="completed_on" name="completed_on" type="date" value="{{ completed_on }}" required></div>
    {{ form_fields(fields, answers) }}
    <div class="actions">
      <button type="submit">Save form</button>
      <a href="{{ '/clients/%d/forms/%d' % (client.id, existing.id) if existing else '/clients/%d/forms' % client.id }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
