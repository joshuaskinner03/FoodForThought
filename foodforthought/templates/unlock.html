{% extends "base.html" %}
{% block title %}Unlock FoodForThought{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<section class="card">
  <h1>Unlock</h1>
  <form method="post" action="/unlock">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Unlock</button>
  </form>
</section>
<p class="aside"><a href="/restore">Restore from a backup</a></p>
{% endblock %}
