{% extends "base.html" %}
{% block title %}Note template · FoodForThought{% endblock %}
{% block content %}
<h1>{{ "Edit note template" if template else "New note template" }}</h1>
<form method="post" action="{{ '/library/note-templates/%d' % template.id if template else '/library/note-templates/new' }}">
  <section class="card">
    <div class="grid">
      <div class="field wide"><label for="name">Name</label><input id="name" name="name" value="{{ values.name or '' }}" required></div>
      <div class="field wide">
        <label for="body">Starting text</label>
        <textarea id="body" name="body" rows="16">{{ values.body or '' }}</textarea>
        <p class="hint">Headings you want in every note of this kind. Existing notes are not changed when you edit this.</p>
      </div>
    </div>
    <div class="actions"><button type="submit">Save template</button><a href="/library">Cancel</a></div>
  </section>
</form>
{% endblock %}
